name: Desktop release

on:
  workflow_dispatch:

# These are unsigned ad-hoc signed release builds, not notarized installers.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundle: mobile-app/build/windows/x64/runner/Release/
          - os: ubuntu-latest
            platform: linux
            bundle: mobile-app/build/linux/x64/release/bundle/
          - os: macos-latest
            platform: macos
            bundle: mobile-app/build/macos/Build/Products/Release/
    runs-on: ${{ matrix.os }}
    environment: desktop-build
    defaults:
      run:
        shell: bash
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          path: mobile-app
      - uses: actions/checkout@v4
        with:
          repository: YakiHonne/nostr_core_enhanced
          ref: bd84e5fdd1a7c7da810ca209492beedc20cc340f
          path: nostr_core_enhanced
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libcurl4-openssl-dev
      - name: Install Windows build dependencies
        if: matrix.platform == 'windows'
        run: |
          echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" >> "$GITHUB_ENV"
      - name: Use ad-hoc macOS signing
        if: matrix.platform == 'macos'
        run: |
          # No provisioning profiles on CI: ad-hoc sign so the app still runs
          # locally; proper Developer ID signing happens at distribution time.
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = JU5BUTKJC2;//' macos/Runner.xcodeproj/project.pbxproj
      - name: Restore build configuration
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -z "$APP_ENV" ]; then
            echo 'Missing APP_ENV in the desktop-build environment.' >&2
            exit 1
          fi
          printf '%s' "$APP_ENV" > .env
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned candidate
        run: flutter build ${{ matrix.platform }} --release --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-unsigned-candidate
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-debug-symbols
          path: mobile-app/build/symbols/
          if-no-files-found: error
          retention-days: 7
