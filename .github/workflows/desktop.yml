name: Desktop release

on:
  workflow_dispatch:

# These are unsigned ad-hoc signed release builds, not notarized installers.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    environment: desktop-build
    defaults:
      run:
        shell: bash
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          path: mobile-app
      - uses: actions/checkout@v4
        with:
          repository: YakiHonne/nostr_core_enhanced
          ref: bd84e5fdd1a7c7da810ca209492beedc20cc340f
          path: nostr_core_enhanced
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libcurl4-openssl-dev
      - name: Use ad-hoc macOS signing
        if: matrix.platform == 'macos'
        run: |
          # No provisioning profiles on CI: ad-hoc sign so the app still runs
          # locally; proper Developer ID signing happens at distribution time.
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = JU5BUTKJC2;//' macos/Runner.xcodeproj/project.pbxproj
      - name: Restore build configuration
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -z "$APP_ENV" ]; then
            echo 'Missing APP_ENV in the desktop-build environment.' >&2
            exit 1
          fi
          printf '%s' "$APP_ENV" > .env
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned candidate
        run: flutter build ${{ matrix.platform }} --release --obfuscate --split-debug-info=build/symbols
      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)').Matches.Groups[1].Value.Trim()
          if (-not $version) { throw 'Could not read the application version from pubspec.yaml' }
          $bundle = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $output = Join-Path (Get-Location) 'build/installers'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBundleDir=$bundle" "/DAppVersion=$version" "/O$output" 'windows/packaging/yakihonne.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | cut -d '+' -f 1)"
          if [ -z "$version" ]; then
            echo 'Could not read the application version from pubspec.yaml' >&2
            exit 1
          fi
          release_dir='build/macos/Build/Products/Release'
          app_path="$(find "$release_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle was found in $release_dir" >&2
            exit 1
          fi

          installer_dir="$PWD/build/installers"
          staging_dir="$(mktemp -d "$PWD/build/dmg-staging.XXXXXX")"
          mkdir -p "$installer_dir"
          cp -R "$app_path" "$staging_dir/"
          ln -s /Applications "$staging_dir/Applications"
          hdiutil create -volname "YakiHonne" -srcfolder "$staging_dir" \
            -ov -format UDZO "$installer_dir/YakiHonne-${version}-macos.dmg"

      - name: Package Linux Debian installer
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | cut -d '+' -f 1)"
          test -n "$version"
          mkdir -p build/installers
          sh linux/packaging/build-deb.sh build/linux/x64/release/bundle "$version" \
            "$PWD/build/installers/YakiHonne-${version}-linux-amd64.deb"
          package_root="$(mktemp -d)"
          trap 'rm -rf "$package_root"' EXIT
          dpkg-deb -x "build/installers/YakiHonne-${version}-linux-amd64.deb" "$package_root"
          test -x "$package_root/usr/bin/yakihonne"
          test -e "$package_root/opt/yakihonne/lib/libsqlite3.so"
          LD_LIBRARY_PATH="$package_root/opt/yakihonne/lib" python3 -c \
            'import ctypes; db = ctypes.CDLL("libsqlite3.so"); db.sqlite3_libversion.restype = ctypes.c_char_p; print("SQLite runtime:", db.sqlite3_libversion().decode())'
          dpkg-deb -f "build/installers/YakiHonne-${version}-linux-amd64.deb" Depends | grep -q 'libsqlite3-0'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-debug-symbols
          path: mobile-app/build/symbols/
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: mobile-app/build/installers/*
          archive: false
          if-no-files-found: error
          retention-days: 7
