name: Android release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Distribution track
        type: choice
        required: true
        options: [internal, production]
      release_notes:
        description: Optional store release notes (leave blank to use the changelog)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: play-store
    timeout-minutes: 120
    env:
      RELEASE_TRACK: ${{ inputs.track }}
      SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
      SENTRY_URL: ${{ secrets.GLITCHTIP_URL }}
      GLITCHTIP_ORG: ${{ secrets.GLITCHTIP_ORG }}
      GLITCHTIP_PROJECT: ${{ secrets.GLITCHTIP_PROJECT }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: mobile-app
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: YakiHonne/nostr_core_enhanced
          ref: bd84e5fdd1a7c7da810ca209492beedc20cc340f
          path: nostr_core_enhanced
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Prepare version and release notes
        id: release
        working-directory: mobile-app
        env:
          RELEASE_NOTES_OVERRIDE: ${{ inputs.release_notes }}
        run: python3 .github/scripts/release_notes.py --platform "android"
      - name: Check existing release tag
        if: inputs.track == 'production'
        working-directory: mobile-app
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA" || { echo 'Existing release tag points to a different commit.' >&2; exit 1; }
          fi
      - name: Restore shared configuration
        working-directory: mobile-app
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          for setting in APP_ENV SENTRY_AUTH_TOKEN SENTRY_URL GLITCHTIP_ORG GLITCHTIP_PROJECT; do
            if [ -z "${!setting}" ]; then
              echo "Missing required configuration: $setting" >&2
              exit 1
            fi
          done
          printf '%s' "$APP_ENV" > .env
      - name: Restore Android Firebase configuration
        working-directory: mobile-app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Install dependencies
        working-directory: mobile-app
        run: |
          bundle install
          flutter pub get --enforce-lockfile
      - name: Configure Android signing
        working-directory: mobile-app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" && test -n "$ANDROID_STORE_PASSWORD" && test -n "$PLAY_SERVICE_ACCOUNT_JSON"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' "$RUNNER_TEMP/upload.jks" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$ANDROID_STORE_PASSWORD" > android/key.properties
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          printf '\nflutter.minSdkVersion=24\nflutter.targetSdkVersion=36\n' >> android/local.properties
      - name: Build Android
        working-directory: mobile-app
        run: flutter build appbundle --release
      - name: Build APKs for GitHub release
        if: inputs.track == 'production'
        working-directory: mobile-app
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          APP_BUILD: ${{ steps.release.outputs.build }}
        run: |
          flutter build apk --release --split-per-abi --dart-define=IAP_ENABLED=false
          mkdir -p build/release-apks
          for abi in arm64-v8a armeabi-v7a x86_64; do
            matches=(build/app/outputs/flutter-apk/*"$abi"-release.apk)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "Expected exactly one APK for $abi" >&2
              exit 1
            fi
            cp "${matches[0]}" "build/release-apks/yakihonne-$APP_VERSION-$APP_BUILD-$abi-release.apk"
          done
      - name: Upload debug symbols to GlitchTip
        working-directory: mobile-app
        run: dart run sentry_dart_plugin "--sentry-define=org=$GLITCHTIP_ORG" "--sentry-define=project=$GLITCHTIP_PROJECT"
      - name: Publish Android
        working-directory: mobile-app
        env:
          PLAY_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/play-service-account.json
        run: |
          mkdir -p build/play-metadata/en-US/changelogs
          cp release-notes.txt build/play-metadata/en-US/changelogs/default.txt
          bundle exec fastlane android release
      - name: Create GitHub release
        if: inputs.track == 'production'
        working-directory: mobile-app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/release-apks/*.apk
          else
            gh release create "$RELEASE_TAG" build/release-apks/*.apk --target "$GITHUB_SHA" --title "YakiHonne $APP_VERSION" --notes-file release-body.md
          fi
